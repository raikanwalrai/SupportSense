deep_learning:

  defaults:
    seed: 42
    device: cpu
    max_vocab_size: 2500
    max_length: 48
    checkpoint_path: models/deep_learning/best_model.pt

  profiles:

    smoke:
      epochs: 1
      batch_size: 64
      learning_rate: 0.001
      embedding_dim: 16
      patience: 1
      dropout: 0.0

    full:
      epochs: 20
      batch_size: 32
      learning_rate: 0.001
      embedding_dim: 128
      patience: 3
      dropout: 0.2

  tuning:

    smoke:
      max_concurrent_trials: 1
      max_t: 1
      grace_period: 1
      reduction_factor: 2

      trials:
        - learning_rate: 0.001
          embedding_dim: 16
          dropout: 0.0

        - learning_rate: 0.0005
          embedding_dim: 16
          dropout: 0.0

    full:
      max_concurrent_trials: 1
      max_t: 20
      grace_period: 3
      reduction_factor: 2

      trials:
        - learning_rate: 0.001
          embedding_dim: 128
          dropout: 0.2

        - learning_rate: 0.0005
          embedding_dim: 128
          dropout: 0.2

        - learning_rate: 0.001
          embedding_dim: 256
          dropout: 0.3
