name: SupportSense CI

on:
  push:
    branches:
      - "**"
permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dl.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dl.txt

      - name: Verify Python environment
        run: |
          python --version
          python -m pip --version
          python -c "import sys; print(sys.executable)"
          python -c "import torch; print('torch:', torch.__version__)"


      - name: Inspect OIDC claims
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          url = request_url + "&audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"bearer {request_token}"
              },
          )

          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          jwt = payload["value"]
          claims_b64 = jwt.split(".")[1]
          claims_b64 += "=" * (-len(claims_b64) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(claims_b64).decode("utf-8")
          )

          print("OIDC claims:")
          for key in (
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_owner",
              "ref",
              "event_name",
          ):
              print(f"{key}: {claims.get(key)}")
          PY




      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::429601541404:role/SupportSenseGitHubActionsDVC
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Pull DVC data
        run: |
          dvc pull

      - name: Reproduce DVC pipeline
        run: |
          dvc repro

      - name: Start MLflow tracking server
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          mkdir -p .ci/mlruns .ci/mlartifacts
          nohup mlflow server \
            --host 127.0.0.1 \
            --port 5000 \
            --backend-store-uri "sqlite:///$(pwd)/.ci/mlflow.db" \
            --default-artifact-root "$(pwd)/.ci/mlruns" \
            --artifacts-destination "$(pwd)/.ci/mlartifacts" \
            > .ci/mlflow.log 2>&1 &

          for i in {1..30}; do
            if curl -sf http://127.0.0.1:5000/version >/dev/null 2>&1; then
              echo "MLflow health: OK"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "ERROR: MLflow did not become healthy."
              cat .ci/mlflow.log
              exit 1
            fi

            sleep 2
          done

      - name: Verify MLflow environment
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          echo "MLFLOW_TRACKING_URI=$MLFLOW_TRACKING_URI"
          curl -sf "$MLFLOW_TRACKING_URI/version"
          echo

      - name: Run test suite
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
        run: |
          python -m pytest -q
