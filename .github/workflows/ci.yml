name: SupportSense CI

on:
  push:
    branches:
      - "**"
permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dl.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dl.txt

      - name: Verify Python environment
        run: |
          python --version
          python -m pip --version
          python -c "import sys; print(sys.executable)"
          python -c "import torch; print('torch:', torch.__version__)"


      - name: Inspect OIDC claims
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          request_token = os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]

          url = request_url + "&audience=sts.amazonaws.com"

          request = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"bearer {request_token}"
              },
          )

          with urllib.request.urlopen(request) as response:
              payload = json.load(response)

          jwt = payload["value"]
          claims_b64 = jwt.split(".")[1]
          claims_b64 += "=" * (-len(claims_b64) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(claims_b64).decode("utf-8")
          )

          print("OIDC claims:")
          for key in (
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_owner",
              "ref",
              "event_name",
          ):
              print(f"{key}: {claims.get(key)}")
          PY




      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::429601541404:role/SupportSenseGitHubActionsDVC
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Pull DVC data
        run: |
          dvc pull

      - name: Reproduce DVC pipeline
        run: |
          dvc repro

      - name: Run test suite
        run: |
          python -m pytest -q
